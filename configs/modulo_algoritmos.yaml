# Módulo de algoritmos: los 15 métodos básicos acordados, en su versión básica, más Random Search.
# Prueba reducida (5 corridas, D = 10, 1 000·D evaluaciones) para revisar y documentar.
experimento: modulo_algoritmos
algoritmos:
  - externo:RandomSearch    # baseline estocástico (no es metaheurística; no existe en MEALPY)
  - OriginalHC              # Hill Climbing
  - OriginalSA              # SA (Simulated Annealing)
  - OriginalTLO             # TLBO
  - OriginalPSO             # PSO
  - OriginalDE              # Evolución Diferencial
  - BaseGA                  # Algoritmo Genético (OriginalGA no evoluciona en MEALPY 3.0.3)
  - OriginalABC             # Colonia Artificial de Abejas
  - OriginalACOR            # ACO para dominios continuos (ACO_R)
  - CMA_ES                  # Estrategia Evolutiva con Adaptación de la Matriz de Covarianza
  - OriginalTS              # Tabu Search
  - OriginalASO             # Atom Search Optimization
  - OriginalGWO             # Grey Wolf Optimizer
  - externo:EDA             # Estimation of Distribution Algorithm, UMDA_c (no existe en MEALPY)
  - OriginalICA             # Imperialist Competitive Algorithm
  - OriginalSCA             # Sine Cosine Algorithm
funciones: ["builtin:esfera_desplazada", "cec2017:F1", "cec2017:F4"]
dimensiones: [10]
corridas: 5
fe_por_dim: 1000
pop_size: 50
